services:

  # ── InfluxDB – Telemetrie-Zeitreihen ──────────────────────────────────────
  influxdb:
    # Muss zur Version der Daten im Volume passen (aktuell 2.8) — kein Downgrade.
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE:        setup
      DOCKER_INFLUXDB_INIT_USERNAME:    admin
      DOCKER_INFLUXDB_INIT_PASSWORD:    maggie2026
      DOCKER_INFLUXDB_INIT_ORG:        ${INFLUX_ORG:-MAGGIE}
      DOCKER_INFLUXDB_INIT_BUCKET:     ${INFLUX_BUCKET:-MAGGIE_DB}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-}
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  # Bestehendes Volume mit den Telemetriedaten (außerhalb von Compose angelegt)
  influxdb-data:
    name: influxdb-data
    external: true
